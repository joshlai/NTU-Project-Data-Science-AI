version: 1
default_environment: dev
project_id: 1bf9ee96-8893-4545-a812-c733ffaf2c1d
environments:
- name: dev
- name: staging
- name: prod
plugins:
  extractors:
  - name: tap-csv
    variant: meltanolabs
    pip_url: git+https://github.com/MeltanoLabs/tap-csv.git
    config:
      files:
      - path: /home/happy/ntu/Module-2-Assignment-Project/economic_data_fred.csv
        entity: economic_data_fred
        table_name: stock_prices
        keys:
        - date
      - path: /home/happy/ntu/Module-2-Assignment-Project/yfinance_data/combined_tickers.csv
        entity: combined_tickers
        table_name: economics_event
        keys:
        - ticker
        - date
  loaders:
  - name: target-jsonl
    variant: andyh1203
    pip_url: target-jsonl
  - name: target-bigquery
    variant: z3z1ma
    pip_url: git+https://github.com/z3z1ma/target-bigquery.git
    config:
      project: module2project-462306
      credentials_path: 
        *Your google cloud services account key
      method: batch_job
      denormalized: true
      flattening_enabled: true
      flattening_max_depth: 1
      dataset: yfinance_econdata
