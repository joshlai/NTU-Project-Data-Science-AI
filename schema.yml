version: 2

sources:
  - name: yfinance_econdata
    database: module2project-462306  # your actual GCP project ID (optional but recommended)
    schema: yfinance_econdata        # this MUST match your actual BigQuery dataset name
    tables:
      - name: combined_tickers
      - name: economic_data_fred

models:
  - name: stg_combined_tickers
    description: "Staging model for combined stock ticker data"
    columns:
      - name: trade_date
        tests: [not_null]
      - name: ticker
        tests: [not_null]

  - name: stg_economic_data_fred
    description: "Staging model for FRED economic data"
    columns:
      - name: event_date
        tests: [not_null]

  - name: fct_stock_vs_macro
    description: "Fact model joining stock data and macroeconomic indicators by date"
